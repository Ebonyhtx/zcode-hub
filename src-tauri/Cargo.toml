[package]
name = "zcode-hub"
version = "1.12.1"
edition = "2021"
license = "MIT"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
sha2 = "0.11"
pbkdf2 = "0.13"
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "7"
whoami = "2"
chrono = "0.4"
rand = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
zeroize = "1"

# enc:v2:os 系统凭据库（Windows Credential Manager）兼容：只用到 CredEnumerateW/CredFree
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

# 发布体积：thin LTO + 单 codegen 单元 + 体积优先 + strip 符号
# （安装包与差分更新流量显著下降；不启用 panic=abort，保留测试/插件生态的 unwind 能力）
[profile.release]
lto = "thin"
codegen-units = 1
opt-level = "s"
strip = true
