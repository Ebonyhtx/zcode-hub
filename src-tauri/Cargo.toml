[package]
name = "zcode-hub"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "5"
whoami = "1"
chrono = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }
