[advisories]
version = 2
# 只阻断真实漏洞与 yanked 依赖。unmaintained 不是漏洞，且当前命中项全部来自
# tauri-plugin-notification 的 Linux 传递依赖（zbus/zvariant 系列，无安全升级路径）；
# 关闭该类检查，避免把上游维护状态当成 CVE 门禁失败。
unmaintained = "none"
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
]

[bans]
# Tauri 生态传递依赖存在多版本；不阻断构建，但保留 warning 以便跟进。
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
