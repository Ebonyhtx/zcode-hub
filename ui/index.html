<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>ZCode Hub</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="light">
<div class="tbar">
  <span class="logo">ZCODE·HUB</span>
  <span class="pill"><i class="dot" id="runDot"></i><span id="runText" data-i18n="checking"></span></span>
  <span class="tspacer"></span>
  <button class="hbtn" id="refreshBtn" title="Refresh" data-action="refresh"><i>⟳</i></button>
  <button class="hbtn" id="themeBtn" title="Theme" data-action="theme">🌙</button>
  <button class="hbtn" title="Settings / About" data-action="cfg">⚙</button>
  <button class="wbtn" data-action="min"><svg viewBox="0 0 10 10"><path d="M0 5h10"/></svg></button>
  <button class="wbtn" data-action="max"><svg viewBox="0 0 10 10"><rect x=".7" y=".7" width="8.6" height="8.6" rx="1"/></svg></button>
  <button class="wbtn close" data-action="hide"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10"/></svg></button>
</div>
<div class="wrap">
  <div class="btnrow">
    <button class="btn" data-action="capture" data-i18n="capture"></button>
    <button class="btn" data-action="add" data-i18n="add"></button>
    <button class="btn" data-action="bak" data-i18n="backup"></button>
    <button class="btn warn" data-action="kill" data-i18n="kill"></button>
  </div>
  <div class="setcard"><div class="setrow">
    <span class="lbl" data-i18n="auto_check"></span>
    <select id="autoCheckSel">
      <option value="0" data-i18n="off"></option>
      <option value="5" data-i18n="min5"></option>
      <option value="15" data-i18n="min15"></option>
      <option value="30" data-i18n="min30"></option>
      <option value="60" data-i18n="min60"></option>
    </select>
    <span class="lbl" data-i18n="notify"></span>
    <label class="tgl"><input type="checkbox" id="notifyTgl"><i></i></label>
    <span class="mut num" id="lastCheckTxt"></span>
    <button class="chkbtn" id="chkBtn" data-action="checkall" data-i18n="check_all"></button>
  </div></div>
  <div class="sec"><span class="t" data-i18n="accounts"></span><span class="c num" id="profCount"></span></div>
  <div id="acctList"><div class="empty"><div class="big">◈</div><p data-i18n="connecting"></p></div></div>
</div>
<div class="toasts" id="toasts"></div>

<div class="overlay" id="addModal" style="display:none">
<div class="mbox">
  <h3 data-i18n="add_title"></h3><div class="sub" data-i18n="add_sub"></div>
  <button class="prov" data-action="prov" data-provider="zai"><span class="chip zai">Z</span><span><span class="pn" data-i18n="zai_name"></span><br><span class="pd" data-i18n="zai_desc"></span></span></button>
  <button class="prov" data-action="prov" data-provider="bigmodel"><span class="chip bm">M</span><span><span class="pn" data-i18n="bm_name"></span><br><span class="pd" data-i18n="bm_desc"></span></span></button>
  <div class="mstatus" id="oauthStatus"></div>
  <div class="mfoot"><button class="reopen" id="oauthReopen" data-action="oauth-reopen" data-i18n="reopen"></button><button class="cancel" data-action="add-cancel" data-i18n="cancel"></button></div>
</div></div>

<div class="overlay" id="cfgModal" style="display:none">
<div class="mbox" style="width:470px">
  <h3 data-i18n="cfg_title"></h3>
  <div class="cfgsec" data-i18n="about"></div>
  <div style="font-size:12px;color:var(--mut);margin-bottom:8px">ZCode Hub <b id="cfgVer" class="num" style="color:var(--tx)"></b><span data-i18n="about_line"></span></div>
  <div class="mline"><button class="camp-btn" data-action="cfg-checkupdate" data-i18n="check_upd"></button><button class="camp-btn" data-action="open-repo" data-url="https://github.com/Ebonyhtx/zcode-hub" data-i18n="repo"></button><span class="mut" id="updTxt"></span></div>
  <div class="cfgsec" data-i18n="zcode_sec"></div>
  <div class="mline"><span class="mlbl" data-i18n="client_path"></span><input id="zcPath" type="text" class="min wide" data-i18n-ph="path_ph"><button class="camp-btn" data-action="cfg-savepath" data-i18n="save"></button></div>
  <div class="mline"><span class="mlbl" data-i18n="datadir"></span><button class="camp-btn" data-action="cfg-opendata" data-i18n="open_hub_data"></button><button class="camp-btn" data-action="cfg-openzdata" data-i18n="open_zdata"></button></div>
  <div class="cfgsec" data-i18n="sys_sec"></div>
  <div class="mline"><span class="mlbl" data-i18n="autostart"></span><label class="tgl"><input type="checkbox" id="autoStartTgl"><i></i></label><span class="mut" data-i18n="autostart_hint"></span></div>
  <div class="mline"><span class="mlbl" data-i18n="hot"></span><label class="tgl"><input type="checkbox" id="hotTgl"><i></i></label><span class="mut" data-i18n="hot_hint"></span></div>
  <div class="mline"><span class="mlbl" data-i18n="lang"></span><select id="langSel"><option value="zh">中文</option><option value="en">English</option></select></div>
  <div class="mfoot"><span></span><button class="cancel" data-action="cfg-close" data-i18n="close"></button></div>
</div></div>

<div class="overlay" id="bakModal" style="display:none">
<div class="mbox">
  <h3 data-i18n="bak_title"></h3><div class="sub" data-i18n="bak_sub"></div>
  <div class="mline"><span class="mlbl" data-i18n="export_to"></span><input id="bakPwd" type="password" class="min" data-i18n-ph="bak_ph"><button class="camp-btn" data-action="bak-export" data-i18n="export_btn"></button></div>
  <div class="mline"><span class="mlbl" data-i18n="import_from"></span><input id="impPath" type="text" class="min wide" data-i18n-ph="imp_path_ph"><input id="impPwd" type="password" class="min" data-i18n-ph="imp_pwd_ph"><button class="camp-btn" data-action="bak-import" data-i18n="import_btn"></button></div>
  <div class="mstatus" id="bakStatus"></div>
  <div class="mfoot"><span></span><button class="cancel" data-action="bak-close" data-i18n="close"></button></div>
</div></div>

<script src="app.js"></script>
</body>
</html>
