name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    timeout-minutes: 30
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          persist-credentials: false
          fetch-depth: 0

      # Tags must point at a commit already merged to main; never release an
      # unreviewed branch commit.
      - name: Require tag commit to be on main
        shell: bash
        run: |
          git fetch origin main --depth=50
          commit=$(git rev-parse "${GITHUB_SHA}^{commit}")
          git merge-base --is-ancestor "$commit" origin/main

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (pinned 2026-11-03)
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy (warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # 提前跑：Release 说明来自 CHANGELOG，一旦提取失败就没必要再花时间构建安装包。
      # Windows runner 的控制台默认 cp1252，这里同时验证中文输出不会崩（v1.10.2 踩过）。
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          bash scripts/release-notes.sh > "$RUNNER_TEMP/release-notes.md"
          echo "--- first lines ---"
          head -n 5 "$RUNNER_TEMP/release-notes.md"

  security:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
      - name: Dependency policy (RustSec advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: --all-features

  build:
    timeout-minutes: 60
    needs: [verify, security]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          persist-credentials: false

      - name: Secret scan before publish
        shell: bash
        run: bash scripts/secret-scan.sh --history

      - name: Repo consistency gate
        shell: bash
        run: bash scripts/repo-check.sh

      - name: Install Rust (pinned)
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (pinned 2026-11-03)
        with:
          toolchain: "1.97.1"

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Build NSIS installer + updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # 固定 CLI 版本：@latest 会让同一 tag 的构建产物不可复现
        run: npx --yes @tauri-apps/cli@2.12.4 build --bundles nsis

      - name: Prepare latest.json (updater manifest)
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $ver = $conf.version
          $sig = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.sig" | Select-Object -First 1
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*x64-setup.exe" | Select-Object -First 1
          $exeName = $exe.Name.Replace(' ', '.')  # GitHub 资产名把空格换成点
          $signature = (Get-Content $sig.FullName -Raw).Trim()
          $json = [ordered]@{
            version = $ver
            notes = "ZCode Hub v$ver"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{ "windows-x86_64" = [ordered]@{ signature = $signature; url = "https://github.com/Ebonyhtx/zcode-hub/releases/latest/download/$exeName" } }
          }
          $json | ConvertTo-Json -Depth 5 | Set-Content "src-tauri/target/release/bundle/nsis/latest.json" -Encoding utf8

      # Release 说明取自 CHANGELOG 的对应版本段落（可审阅），不用 commit 标题现凑。
      # verify job 已经跑过一次；这里重新生成到工作目录供 action-gh-release 使用。
      - name: Extract release notes from CHANGELOG
        shell: bash
        run: bash scripts/release-notes.sh > release-notes.md

      # 供应链可验证：安装包 / latest.json / SBOM 的 SHA-256 随 Release 一起发布
      - name: Generate SBOM (SPDX JSON)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: src-tauri/target/release/bundle/nsis/zcode-hub-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      # 必须排在 SBOM 之后：否则 .spdx.json 还没生成，校验和会漏掉它
      - name: Write SHA-256 checksums
        shell: pwsh
        run: |
          $dir = "src-tauri/target/release/bundle/nsis"
          $files = Get-ChildItem $dir -File | Where-Object {
            $_.Name -like "*x64-setup.exe" -or $_.Name -eq "latest.json" -or $_.Name -like "*.spdx.json"
          } | Sort-Object Name
          if (-not $files) { throw "no release artifacts found in $dir" }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          # 统一换行，避免 git/编辑器差异影响校验工具
          ($lines -join "`n") + "`n" | Set-Content "$dir/SHA256SUMS.txt" -Encoding ascii -NoNewline

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ZCode-Hub-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/zcode-hub-sbom.spdx.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          body_path: release-notes.md
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
            src-tauri/target/release/bundle/nsis/SHA256SUMS.txt
            src-tauri/target/release/bundle/nsis/zcode-hub-sbom.spdx.json
