name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan before publish
        shell: bash
        run: bash scripts/secret-scan.sh --history

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Build NSIS installer + updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx --yes @tauri-apps/cli@latest build --bundles nsis

      - name: Prepare latest.json (updater manifest)
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $ver = $conf.version
          $sig = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.sig" | Select-Object -First 1
          $exe = Get-ChildItem "src-tauri/target/release/bundle/nsis/*x64-setup.exe" | Select-Object -First 1
          $signature = (Get-Content $sig.FullName -Raw).Trim()
          $json = [ordered]@{
            version = $ver
            notes = "ZCode Hub v$ver"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = [ordered]@{ "windows-x86_64" = [ordered]@{ signature = $signature; url = "https://github.com/Ebonyhtx/zcode-hub/releases/latest/download/$($exe.Name)" } }
          }
          $json | ConvertTo-Json -Depth 5 | Set-Content "src-tauri/target/release/bundle/nsis/latest.json" -Encoding utf8

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZCode-Hub-setup
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/latest.json
          generate_release_notes: true
