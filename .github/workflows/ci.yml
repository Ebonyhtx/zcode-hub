name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Tauri Linux prerequisites (platform stubs still link tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (pinned 2026-11-03)
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Frontend syntax
        shell: bash
        run: |
          node --check ui/app.js
          node scripts/i18n-check.js
      - name: Run unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy (warnings are errors)
        if: runner.os == 'Windows'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        shell: bash
        run: bash scripts/secret-scan.sh --history
      - name: Scanner selftest
        shell: bash
        run: bash scripts/secret-scan.sh --selftest
      - name: Repo consistency gate
        shell: bash
        run: bash scripts/repo-check.sh
