name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
      - name: Install Tauri Linux prerequisites (platform stubs still link tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch (pinned 2026-11-03)
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Frontend syntax
        shell: bash
        run: |
          node --check ui/app.js
          node scripts/i18n-check.js
      - name: Rust formatting
        if: runner.os == 'Windows'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Run unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Clippy (warnings are errors)
        if: runner.os == 'Windows'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  ui-e2e:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0 (Node 24)
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run UI E2E
        run: npm run test:e2e
      - name: Upload failure screenshots and report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 14
          if-no-files-found: ignore

  security:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
      - name: Dependency policy (RustSec advisories, licenses, bans, sources)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          arguments: --all-features

  secret-scan:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0 (Node 24)
        with:
          fetch-depth: 0
      - name: Scan full history for secrets
        shell: bash
        run: bash scripts/secret-scan.sh --history
      - name: Scanner selftest
        shell: bash
        run: bash scripts/secret-scan.sh --selftest
      - name: Repo consistency gate
        shell: bash
        run: bash scripts/repo-check.sh
