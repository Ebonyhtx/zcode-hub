version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Windows-only product: glib is pulled only by the Linux GTK stack
      # (tauri -> gtk 0.18 -> glib 0.18). The fix needs glib 0.20 / gtk 0.20,
      # which Tauri 2 does not use yet. See SECURITY.md for the exception.
      - dependency-name: "glib"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Workflow actions are pinned by commit SHA and upgraded deliberately
      # after a manual review; do not auto-open major-version PRs.
      # Review cadence: once per quarter — see CONTRIBUTING.md 「依赖升级节奏」.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
