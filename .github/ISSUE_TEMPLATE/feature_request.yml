name: 💡 功能建议 / Feature request
description: 建议一个新功能或改进 / Suggest an idea
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
      description: 先说场景，再说方案 / Scenario first, solution second
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望方案 / Proposed solution
  - type: checkboxes
    id: scope
    attributes:
      label: 边界确认 / Scope check
      options:
        - label: 我了解本项目不做「自动领取福利」与验证码自动化 / I understand auto-claiming & captcha automation are out of scope
